<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Demo - Home</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/home.css">
</head>

<body class="home">

    <!-- ================= พื้นหลังใต้น้ำ =================
         ถ้าวางไฟล์ภาพไว้ที่ images/home-bg.gif (ตั้งค่าใน js/script.js)
         ภาพจะมาแสดงแทนฉากที่วาดด้วย CSS อัตโนมัติ -->
    <div class="home-bg" aria-hidden="true">
        <span class="home-ripple"></span>
        <span class="home-light l1"></span>
        <span class="home-light l2"></span>
        <span class="home-light l3"></span>
    </div>
    <div class="home-bubbles" aria-hidden="true"></div>
    <div class="home-wordmark" aria-hidden="true">Suriya</div>

    <div class="home-scene">

        <!-- การ์ดชื่อ (มุมซ้ายบน) -->
        <div class="home-card">
            <h1>Suriya</h1>
            <p>Web Developer | UI Designer | Student</p>
        </div>

        <!-- ================= เมนูหลัก ================= -->
        <div class="home-menu" role="navigation" aria-label="เมนูหลัก">
            <ul class="home-list">
                <li style="--n:0"><a href="about.html"   data-title="About"   data-desc="ประวัติและข้อมูลส่วนตัว">About</a></li>
                <li style="--n:1"><a href="skills.html"  data-title="Skills"  data-desc="ทักษะการเขียนโค้ดและดีไซน์">Skills</a></li>
                <li style="--n:2"><a href="gallery.html" data-title="Gallery" data-desc="รวบรวมผลงานและกิจกรรม">Gallery</a></li>
                <li style="--n:3"><a href="contact.html" data-title="Contact" data-desc="ส่งข้อความติดต่อผมได้ที่นี่">Contact</a></li>
                <li style="--n:4"><a href="other.html"   data-title="Other"   data-desc="ลิงก์ลัดและแหล่งข้อมูลอื่นๆ">Other</a></li>
            </ul>
        </div>

        <!-- คำอธิบายเมนูที่เลือก + ปุ่มลัด (มุมขวาล่าง) -->
        <div class="home-hint">
            <div class="home-desc">
                <strong class="home-desc-title">About</strong>
                <span class="home-desc-text">ประวัติและข้อมูลส่วนตัว</span>
            </div>
            <div class="home-keys">
                <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> Select</span>
                <span><kbd>Enter</kbd> Confirm</span>
            </div>
        </div>

        <!-- เพลงที่ชอบ (มุมซ้ายล่าง) -->
        <div class="home-music">
            <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/0lqHgjNrXmtFroWDqwV1iQ?utm_source=generator&si=e7bf3ad4c94c4473" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
